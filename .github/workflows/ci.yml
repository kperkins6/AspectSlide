name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test AspectSlide.sln -c Release --filter "FullyQualifiedName!~SettingsFormActionTests"
      - name: Publish
        run: dotnet publish src/AspectSlide/AspectSlide.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true
